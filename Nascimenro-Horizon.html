<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nascimenro-Horizon.html</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
}

textarea {
    width: 100%;
    height: 45vh;
    resize: vertical;
    background: #1e1e1e;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 15px;
    font-size: 16px;
    line-height: 1.5;
    outline: none;
}

.botoes {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

button {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #d4af37;
    color: #111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#limpar {
    background: #333;
    color: white;
}

#status {
    margin-top: 10px;
    text-align: center;
    color: #aaa;
}

#resultado {
    display: none;
    margin-top: 20px;
    padding: 18px;
    background: #1e1e1e;
    border: 1px solid #444;
    border-radius: 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.6;
}
</style>
</head>

<body>

<textarea
    id="texto"
    placeholder="Cole ou escreva aqui..."
></textarea>

<div class="botoes">

    <button onclick="salvar()">
        Salvar no GitHub
    </button>

    <button id="limpar" onclick="limpar()">
        Limpar
    </button>

</div>

<div id="status"></div>

<div id="resultado"></div>

<script>

const OWNER = "danielnep";
const REPO = "Servidor-Para-IAs";
const FILE = "Nascimenro-Horizon.html";
const BRANCH = "main";

async function salvar() {

    const texto = document.getElementById("texto").value;
    const status = document.getElementById("status");
    const resultado = document.getElementById("resultado");

    if (!texto.trim()) {
        status.textContent = "Digite ou cole algum texto.";
        return;
    }

    const token = prompt("Cole seu GitHub Token:");

    if (!token) {
        status.textContent = "Salvamento cancelado.";
        return;
    }

    status.textContent = "Salvando...";

    try {

        const url =
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(FILE)}`;

        const consulta = await fetch(
            `${url}?ref=${BRANCH}`,
            {
                headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: "application/vnd.github+json"
                }
            }
        );

        let sha = null;

        if (consulta.ok) {

            const arquivo = await consulta.json();

            sha = arquivo.sha;
        }

        const bytes = new TextEncoder().encode(texto);

        let binary = "";

        for (const byte of bytes) {
            binary += String.fromCharCode(byte);
        }

        const conteudo = btoa(binary);

        const resposta = await fetch(url, {

            method: "PUT",

            headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/vnd.github+json",
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                message: "Atualiza Nascimenro-Horizon.html",

                content: conteudo,

                sha: sha,

                branch: BRANCH
            })
        });

        if (!resposta.ok) {

            const erro = await resposta.json();

            throw new Error(
                erro.message || "Não foi possível salvar."
            );
        }

        status.textContent =
            "✓ Salvo no GitHub.";

        // Mostra o texto logo abaixo
        resultado.textContent = texto;
        resultado.style.display = "block";

    } catch (erro) {

        console.error(erro);

        status.textContent =
            "Erro: " + erro.message;
    }
}

function limpar() {

    document.getElementById("texto").value = "";

    document.getElementById("resultado").style.display = "none";

    document.getElementById("status").textContent = "";
}

</script>

</body>
</html>
